# =============================================================================
# SynPharm 服务编排（企业级）
#
# 使用方式（生产环境，镜像需预构建）：
#   cd deploy
#   cp .env.example .env        # 首次：复制模板并修改密码/密钥
#   docker compose up -d
#
# 首次部署前先构建镜像（在 4 仓库共同父目录下执行）：
#   docker build -t synpharm/gateway:${SYNPHARM_VERSION:-1.0.0} synpharm-cloud
#   docker build -t synpharm/fastapi:${SYNPHARM_VERSION:-1.0.0} synpharm-fastapi
#   docker build -t synpharm/frontend:${SYNPHARM_VERSION:-1.0.0} synpharm-frontend
#
# 说明：单体 synpharm-backend 已于 2026-10-16 退役（零端点），**不再需要构建其镜像**；
# 源码目录也已于 2026-10-19 从工作区删除（备份见 _synpharm-backend-final-backup-20261019.zip）。
#
# 开发环境请使用 docker-compose.dev.yml（源码挂载 + 热重载）。
# 所有敏感配置（密码、JWT 密钥等）一律从 .env 读取，严禁硬编码。
# =============================================================================

name: synpharm

services:
  # ---------------------------------------------------------------------------
  # MySQL 8.0（数据库）
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: synpharm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-synpharm}
      MYSQL_USER: ${MYSQL_USER:-synpharm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      # 供 sql/00_create_accounts.sh 建「每服务独立账号」（仅在数据卷为空时执行）
      # 注意：本文件的 sql/ 初始化脚本会按 USE <schema> 写入各服务 schema，因此即使
      # prod 暂未部署某服务，也要在此提供其账号变量 —— 否则脚本会**静默跳过**该账号
      # （口令为空即跳过，不建弱口令账号），未来启用该服务时会以「账号不存在」失败。
      AUTH_DB_USER: ${AUTH_DB_USER:-synpharm_auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-}
      # 2026-10-22 服务收敛：原 design/asset/platform 三个账号合并为一个 core 账号
      CORE_DB_USER: ${CORE_DB_USER:-synpharm_core}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:-}
      PREDICT_DB_USER: ${PREDICT_DB_USER:-synpharm_predict}
      PREDICT_DB_PASSWORD: ${PREDICT_DB_PASSWORD:-}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化自动执行 sql/ 下的建表脚本
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - synpharm
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis 7（缓存 / 验证码 / Token 黑名单）
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: synpharm-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - synpharm
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # RabbitMQ 3.13（消息队列：批量任务异步调度）
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: synpharm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-synpharm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}
    ports:
      # 管理台仅限内网/本机访问，生产不暴露公网
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - synpharm
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Nacos 2.4（注册中心 + 配置中心）
  #
  # 单机模式（embedded derby），无需额外 MySQL 库。
  # 生产必须开启鉴权：NACOS_AUTH_TOKEN 需为 ≥32 字节的 base64 字符串，
  # 生成：openssl rand -base64 48
  # 控制台：http://<host>:${NACOS_PORT:-18848}/nacos （首次登录 nacos/nacos，请立即改密）
  # ---------------------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: synpharm-nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请在 .env 中设置 NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?请在 .env 中设置 NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?请在 .env 中设置 NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 512m
      JVM_XMX: 1g
      JVM_XMN: 256m
    ports:
      # 仅内网/本机访问，生产不暴露公网
      - "${NACOS_PORT:-18848}:8848"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - synpharm
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 【已退役】单体 synpharm-backend 服务（2026-10-16）
  # 单体已零端点、零 Mapper；synpharm 库 19 张镜像表已 DROP，网关 monolith 路由已删除。
  # 源码目录已于 2026-10-19 从工作区删除；回滚时解压备份 + 恢复本块 + 网关 monolith 路由。
  # 同时已移除 backend_uploads / backend_results 两个数据卷（不再有服务挂载它们）。
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # 网关（微服务唯一对外入口）
  #
  # 构建镜像（在多模块根目录的父目录执行）：
  #   docker build -t synpharm/gateway:${SYNPHARM_VERSION:-1.0.0} synpharm-cloud
  # 宿主 8080 与拆分前的后端端口一致，因此前端 nginx 只需改上游主机名。
  # ---------------------------------------------------------------------------
  gateway:
    image: synpharm/gateway:${SYNPHARM_VERSION:-1.0.0}
    container_name: synpharm-gateway
    environment:
      SERVER_PORT: 8080
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_DISCOVERY_ENABLED: "true"
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # 阶段 0：只剥离伪造身份头 + 注入身份头，不拦截（零行为变更）
      GATEWAY_AUTH_ENFORCE: ${GATEWAY_AUTH_ENFORCE:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - synpharm
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 身份与访问（阶段 1）
  # 镜像由 synpharm-cloud/Dockerfile 带 MODULE 参数构建：
  #   docker build -t synpharm/auth:1.0.0 --build-arg MODULE=synpharm-auth \
  #     --build-arg SERVER_PORT=8081 synpharm-cloud
  # ---------------------------------------------------------------------------
  auth:
    image: synpharm/auth:${SYNPHARM_VERSION:-1.0.0}
    container_name: synpharm-auth
    environment:
      SERVER_PORT: 8081
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_DISCOVERY_ENABLED: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      AUTH_DB_NAME: synpharm_auth
      AUTH_DB_USER: ${AUTH_DB_USER:-synpharm_auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?请在 .env 中设置 AUTH_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请在 .env 中设置 INTERNAL_TOKEN}
      CAPTCHA_DEV_MODE: ${CAPTCHA_DEV_MODE:-false}
      QQ_EMAIL: ${QQ_EMAIL:-}
      QQ_EMAIL_AUTH_CODE: ${QQ_EMAIL_AUTH_CODE:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - synpharm
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 主业务服务（2026-10-22 收敛：原 design + asset + platform 合并）
  #   docker build -t synpharm/core:1.0.0 --build-arg MODULE=synpharm-core \
  #     --build-arg SERVER_PORT=8083 synpharm-cloud
  # ---------------------------------------------------------------------------
  core:
    image: synpharm/core:${SYNPHARM_VERSION:-1.0.0}
    container_name: synpharm-core
    environment:
      SERVER_PORT: 8083
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_DISCOVERY_ENABLED: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      CORE_DB_NAME: ${CORE_DB_NAME:-synpharm_core}
      CORE_DB_USER: ${CORE_DB_USER:-synpharm_core}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?请在 .env 中设置 CORE_DB_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请在 .env 中设置 INTERNAL_TOKEN}
      # 算法引擎：能力矩阵探测（原 platform 职责，随合并进来）
      FASTAPI_URL: ${FASTAPI_URL:-http://fastapi:8000}
      FASTAPI_API_KEY: ${FASTAPI_API_KEY:-}
      # MQ 拓扑由本服务在启动时声明；缺这几项会默认连 localhost:5672 并**静默声明失败**
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-synpharm}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - synpharm
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # FastAPI 算法引擎（AI 预测）
  # ---------------------------------------------------------------------------
  fastapi:
    image: synpharm/fastapi:${SYNPHARM_VERSION:-1.0.0}
    container_name: synpharm-fastapi
    environment:
      MODEL_DIR: /app/models
      DEVICE: ${FASTAPI_DEVICE:-cpu}
      BATCH_SIZE: ${FASTAPI_BATCH_SIZE:-50}
      # FastAPI 接受的 API Key 列表（逗号分隔）；留空则回退到后端使用的单一 Key；两者都空则关闭认证（仅限内网）
      API_KEYS: ${FASTAPI_API_KEYS:-${FASTAPI_API_KEY:-}}
      LOG_LEVEL: ${FASTAPI_LOG_LEVEL:-INFO}
    ports:
      - "${FASTAPI_PORT:-18050}:8000"
    volumes:
      # 模型文件（不进镜像，统一挂载）
      - ../synpharm-fastapi/models:/app/models:ro
      - fastapi_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - synpharm
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 前端（Nginx 静态资源 + /api 反代到网关）
  # ---------------------------------------------------------------------------
  frontend:
    image: synpharm/frontend:${SYNPHARM_VERSION:-1.0.0}
    container_name: synpharm-frontend
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      - gateway
    volumes:
      # 部署时可覆盖 nginx 配置（镜像内已有默认配置）
      - ../synpharm-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - synpharm
    restart: unless-stopped

# -----------------------------------------------------------------------------
# 网络与数据卷
# -----------------------------------------------------------------------------
networks:
  synpharm:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  nacos_data:
  nacos_logs:
  fastapi_logs:
