# =============================================================================
# SynPharm 前端 nginx 配置（nginx-unprivileged 非 root 运行，监听 8080）
#
# 架构说明：
#   - 前端静态资源由 nginx 直接提供
#   - /api/* 统一反代到网关（gateway:8080），再由网关路由到具体服务
#   - 不再直连 SpringBoot 后端，也不直连 FastAPI（避免绕过网关的鉴权与身份头注入）
#
# 端口为什么仍然是 8080：网关刻意占用 8080（与拆分前 backend 的容器端口一致），
# 因此本文件只需把上游主机名从 backend 改成 gateway。
# =============================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================================================================
    # 压缩
    # 设计工作台（/design）通过 iframe 加载分子编辑器子应用，其入口分块约 29 MB
    # （含 Indigo 化学引擎，WASM 被内联进 JS，无法拆成独立静态文件）。
    # 开启 gzip 后传输量约 8.5 MB，首屏体验差别明显。
    # =========================================================================
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # SPA 路由：所有非静态请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 网关 API 反向代理（保留客户端真实 IP）
    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
